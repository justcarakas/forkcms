services:
  _defaults:
    autowire: true
    autoconfigure: true

  ForkCMS\Modules\Extensions\Domain\:
    resource: '../Domain/*'
    exclude:
      - '../Domain/Module/InstalledModules'

  ForkCMS\Modules\Extensions\Console\:
    resource: '../Console/*'

  ForkCMS\Modules\Extensions\Backend\Actions\:
    resource: '../Backend/Actions/*'

