services:
  _defaults:
    autowire: true
    autoconfigure: true

  ForkCMS\Modules\Frontend\Controller\FrontendAjaxController:
    public: true
    arguments:
      - !tagged_locator { tag: forkcms.frontend.ajax_action }

  ForkCMS\Modules\Frontend\Controller\FrontendRSSController:
    public: true
    arguments:
      - !tagged_locator { tag: forkcms.frontend.rss_action }
