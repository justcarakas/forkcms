# .scrutinizer.yml
build:
    image: default-jammy
    nodes:
        analysis:
            environment:
                php:
                    version: "8.4.1" # Quoted to prevent YAML parsing floats
            cache:
                disabled: false
                directories:
                    - ~/.composer/cache
            project_setup:
                override: true
            dependencies:
                override:
                    # Added --optimize-autoloader to map modern Symfony 8 attributes efficiently
                    - 'composer install --no-interaction --prefer-dist --optimize-autoloader'
            tests:
                override:
                    - php-scrutinizer-run

filter:
    excluded_paths:
        - app.fork5/*
        - bin/*
        - config/*
        - node_modules/*
        - src.fork5/*
        - src/Core/templates/Maker/*
        - tests.fork5/*
        - var/*
        - vendor/*

tools:
    php_analyzer:
        enabled: true
        config:
            parameter_reference_check: { enabled: true }
            checkstyle: { enabled: true }
            suspicious_code: { enabled: true }
            unreachable_code: { enabled: true }
            unused_code: { enabled: true }

    php_mess_detector: true
    php_sim: true
    php_pdepend:
        excluded_dirs:
            - vendor

    php_code_sniffer:
        config:
            standard: phpcs.xml.dist
        filter:
            excluded_paths:
                - 'tests.fork5/*'
                - 'src/Core/templates/Maker/*'
                - 'src/Modules/*/tests/*'

checks:
    php:
        unused_variables: true
        unused_properties: true
        unused_parameters: true
        variable_existence: true
        unused_methods: true
        sql_injection_vulnerabilities: true
        simplify_boolean_return: true
        excluded_dependencies:
            - simple-bus/doctrine-orm-bridge
