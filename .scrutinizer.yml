build:
    nodes:
        analysis:
            environment:
                php:
                    version: 8.2
            cache:
                disabled: false
                directories:
                    - ~/.composer/cache
            project_setup:
                override: true
            tests:
                override:
                    - php-scrutinizer-run

filter:
    excluded_paths:
        - app.fork5/*
        - bin/*
        - config/*
        - node_modules/*
        - src.fork5/*
        - src/Core/templates/Maker/*
        - tests.fork5/*
        - var/*
        - vendor/*

tools:
    php_mess_detector: true
    php_cpd: false
    php_sim: true
    php_pdepend:
        excluded_dirs:
            - vendor

application:
    symfony2:
        autoload_file: vendor/autoload.php
        kernel_class: ForkCMS\Core\Domain\Kernel\Kernel
    dependencies:
        before:
            - 'composer install --no-interaction --prefer-dist'

checks:
    php:
        unused_variables: true
        unused_properties: true
        unused_parameters: true
        variable_existence: true
        unused_methods: true
        sql_injection_vulnerabilities: true
        simplify_boolean_return: true
        excluded_dependencies:
            - simple-bus/doctrine-orm-bridge
